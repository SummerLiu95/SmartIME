name: Sync Release Notes

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without v prefix, for example 1.2.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  sync-release-notes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync changelog section to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="v${VERSION}"
          CHANGELOG_SECTION="$(awk -v version="${VERSION}" '
            $0 ~ "^## \\[" version "\\]" { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md | sed '1{/^[[:space:]]*$/d;}')"

          if [[ -z "${CHANGELOG_SECTION}" ]]; then
            echo "No CHANGELOG.md section found for ${VERSION}."
            exit 1
          fi

          RELEASE_JSON="$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/releases/tags/${TAG}")"

          RELEASE_ID="$(jq -r '.id' <<< "${RELEASE_JSON}")"
          CURRENT_BODY="$(jq -r '.body // ""' <<< "${RELEASE_JSON}")"
          TAIL_BODY="$(awk '
            /^### Assets$/ { capture = 1 }
            capture { print }
          ' <<< "${CURRENT_BODY}")"

          if [[ -z "${TAIL_BODY}" ]]; then
            TAIL_BODY="${CURRENT_BODY}"
          fi

          {
            printf '## SmartIME %s\n\n' "${VERSION}"
            printf '%s\n\n' "${CHANGELOG_SECTION}"
            printf '%s\n' "${TAIL_BODY}"
          } > RELEASE_NOTES.md

          jq -n --rawfile body RELEASE_NOTES.md '{ body: $body }' > payload.json

          curl -fsSL \
            -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/releases/${RELEASE_ID}" \
            --data @payload.json
